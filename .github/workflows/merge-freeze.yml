name: Merge Freeze Enforcement
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  check-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Check if merge freeze is active
        run: |
          if [[ "${{ secrets.MERGE_FREEZE }}" == "true" ]]; then
            echo "Merge freeze is active. Blocking merge."
            exit 1
          else
            echo "Merge freeze not active. PR merge allowed."
          fi
 
